<svg xmlns="http://www.w3.org/2000/svg" width="710" height="376" viewBox="0 0 710 376" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="font-variant-numeric: tabular-nums">
